server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # 远程仓库路由
        - id: remote_service
          uri: lb://remote-gitlet
          predicates:
            - Path=/api/repos/**,/api/ai/**
        # 用户服务路由（含 OSS 头像直传预签名）
        - id: user_service
          uri: lb://user-service
          predicates:
            - Path=/user/**,/api/oss/**
    nacos:
      server-addr: 100.103.241.43:8848
      username: ${NACOS_USERNAME}
      password: ${NACOS_PASSWORD}
      discovery:
        namespace: e7aa35a9-5acb-4192-97ba-3191707726ce
      config:
        namespace: e7aa35a9-5acb-4192-97ba-3191707726ce

security:
  gateway:
    trust-user-id-header: false