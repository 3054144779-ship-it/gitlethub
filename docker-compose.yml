services:
  api:
    build: .
    image: gitlet-ai-helper:latest
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "/app/app",
              "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  index-worker:
    # 复用同一份镜像，compose 不会重复构建
    build: .
    image: gitlet-ai-helper:latest
    command: ["python", "-m", "worker.main"]
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped