model_list:
  # ===== SiliconFlow（6 个 key）=====
  - model_name: Qwen/Qwen3-8B
    litellm_params:
      model: openai/Qwen/Qwen3-8B
      api_key: os.environ/SILICONFLOW_API_KEY_1
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: THUDM/GLM-Z1-9B-0414
    litellm_params:
      model: openai/THUDM/GLM-Z1-9B-0414
      api_key: os.environ/SILICONFLOW_API_KEY_2
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: THUDM/GLM-4-9B-0414
    litellm_params:
      model: openai/THUDM/GLM-4-9B-0414
      api_key: os.environ/SILICONFLOW_API_KEY_3
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: Qwen/Qwen2.5-7B-Instruct
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_key: os.environ/SILICONFLOW_API_KEY_4
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
      api_key: os.environ/SILICONFLOW_API_KEY_5
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: tencent/Hunyuan-MT-7B
    litellm_params:
      model: openai/tencent/Hunyuan-MT-7B
      api_key: os.environ/SILICONFLOW_API_KEY_6
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 1000

  - model_name: BAAI/bge-m3
    litellm_params:
      model: openai/BAAI/bge-m3
      api_key: os.environ/SILICONFLOW_API_KEY_7
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 2000

  - model_name: BAAI/bge-reranker-v2-m3
    litellm_params:
      # SiliconFlow 的 rerank 是 Cohere 兼容格式；用 hosted_vllm 让它把
      # api_base 规范成 /v1/rerank，cohere provider 不会自动补路径
      model: hosted_vllm/BAAI/bge-reranker-v2-m3
      api_key: os.environ/SILICONFLOW_API_KEY_8
      api_base: https://api.siliconflow.cn/v1
      tpm: 50000
      rpm: 2000

  # ===== DeepSeek（2 个 key）=====
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY_1
      rpm: 300
      tpm: 100000
      max_parallel_requests: 8

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY_2
      rpm: 300
      tpm: 100000
      max_parallel_requests: 8

litellm_settings:
  num_retries: 3
  request_timeout: 120
  cache: true
  cache_params:
    type: redis
    host: 100.117.188.7
    port: 6379
    db: 3
  enforce_model_rate_limits: true
  fallbacks:
    - Qwen/Qwen3-8B: ["THUDM/GLM-Z1-9B-0414", "THUDM/GLM-4-9B-0414", "deepseek-flash"]
    - deepseek-flash: ["Qwen/Qwen3-8B", "Qwen/Qwen2.5-7B-Instruct"]

router_settings:
  routing_strategy: least-busy
  redis_host: 100.117.188.7
  redis_port: 6379
  redis_db: 4

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL