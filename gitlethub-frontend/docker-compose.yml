# GitletHub 前端：Nginx 静态站 + /api、/user 反向代理
# 用法：
#   1. 后端中间件 compose 已创建 gitlethub-net 网络（后端部署目录执行过 docker compose up -d）
#   2. cd 到本目录，docker compose up -d --build
# 环境变量见 .env.example。

name: gitlethub-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gitlethub-frontend:latest
    container_name: gitlethub-frontend
    restart: unless-stopped
    ports:
      # 默认 80；被占用时在 .env 里改 FRONTEND_PORT
      - "${FRONTEND_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
      # 网关地址：docker 服务名:端口。网关不在容器里时改成宿主机 IP（或 host.docker.internal:8080）
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway-service:8080}
      # 只让 envsubst 替换 GATEWAY_UPSTREAM，避免把 $uri、$host 等 nginx 变量吃掉
      NGINX_ENVSUBST_FILTER: "^GATEWAY_UPSTREAM$"
    # 网关跑在宿主机时启用下面这行，把宿主机的 8080 暴露为 host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "20m"
        max-file: "2"
    networks:
      - gitlethub-net

networks:
  gitlethub-net:
    external: true
    name: gitlethub-net
