# 该文件是 nginx 模板，容器启动时由官方镜像的 envsubst 脚本渲染成
# /etc/nginx/conf.d/default.conf，只替换 ${GATEWAY_UPSTREAM}。
# 默认网关地址由 docker-compose.yml 注入：gateway-service:8080。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    # 冲突解决时可能整文件回传，留出余量
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # Docker 内置 DNS + 变量 proxy_pass：网关比前端晚启动时 nginx 也能正常起来
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream "http://${GATEWAY_UPSTREAM}";

    # 单页应用：找不到静态文件就回落到 index.html，交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容 hash，可以长期缓存
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，发版后立即生效
    location = /index.html {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/**（仓库、AI、OSS）和 /user/**（注册登录）原样转发给网关
    location ~ ^/(api|user)/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        # AI 评审是长请求，读超时给足
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
