spring:
  application:
    name: remote-gitlet
  jackson:
    date-format: org.openapitools.RFC3339DateFormat
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  data:
    redis:
          port: 6379
          host: 100.117.188.7
          database: 1
          connect-timeout: 1s
          timeout: 1s

# AI 服务：Nacos 注册的服务名，经 LoadBalancer 解析实例地址
ai:
  service:
    name: gitlet-ai-helper

# 开启驼峰命名
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

hm:
  db:
    database: gitlethub
  swagger:
    title: 远程仓库接口文档
    package: com.huahuo.controller


# jwt 密钥配置
com:
  hanabi:
    jwt:
      key: RSA
      expires-time: 604800 # 一周过期
      key-size: 2048